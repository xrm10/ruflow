<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e14" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◎</text></svg>" />
  <title>Ruflo Command — Sign in</title>
  <style>
    :root { --bg:#0a0e14; --panel:#111722; --panel-2:#161d2b; --border:#212b3d; --border-hi:#2c3a52;
            --text:#dbe4f0; --text-dim:#8a97ab; --text-faint:#5b6980; --accent:#2fd6c6; --accent-dim:#1d8a80; --danger:#ef5b6b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center;
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; padding: 20px; }
    .card { width: min(92vw, 360px); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 30px 28px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .mark { font-size: 26px; color: var(--accent); text-shadow: 0 0 14px rgba(47,214,198,.5); }
    .brand b { letter-spacing: 2px; font-size: 15px; }
    .brand small { color: var(--text-faint); letter-spacing: 3px; font-size: 9px; display: block; }
    h1 { font-size: 17px; margin: 18px 0 4px; }
    p.sub { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
    label { font-size: 12px; color: var(--text-dim); font-weight: 600; display: block; margin-bottom: 6px; }
    input { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 9px; padding: 11px 12px; font-size: 14px; outline: none; font-family: inherit; }
    input:focus { border-color: var(--accent-dim); }
    button { width: 100%; margin-top: 16px; background: var(--accent); color: #06231f; border: none; border-radius: 10px;
      padding: 12px; font-weight: 640; font-size: 14px; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand"><span class="mark">◎</span><span><b>RUFLO</b><small>COMMAND</small></span></div>
    <h1>Sign in</h1>
    <p class="sub">Enter the dashboard password to continue.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required />
    <button id="btn" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById('form');
    const pw = document.getElementById('pw');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ password: pw.value }),
        });
        if (res.ok) { location.href = '/'; return; }
        err.textContent = 'Incorrect password.';
      } catch (_) {
        err.textContent = 'Could not reach the server.';
      }
      btn.disabled = false;
      pw.select();
    });
  </script>
</body>
</html>
